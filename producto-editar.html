<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modificar Producto - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 820px;">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="panel.html">Panel de Control</a></li>
      <li class="breadcrumb-item"><a href="productos.html">Productos</a></li>
      <li class="breadcrumb-item active" aria-current="page">Editar Producto</li>
    </ol>
  </nav>
  <div id="alerta" class="alert d-none" role="alert"><span class="msg"></span></div>
  <h1 class="h3 mb-3">Modificar Producto <span class="badge bg-warning text-dark" id="bSku">SKU: ...</span></h1>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form id="form" novalidate>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre del Producto</label>
            <input type="text" class="form-control" id="nombre" minlength="3" required>
            <div class="invalid-feedback">Ingrese el nombre (mínimo 3 caracteres).</div>
          </div>
          <div class="col-md-6">
            <label for="sku" class="form-label">Código SKU</label>
            <input type="text" class="form-control" id="sku" disabled>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="categoria" class="form-label">Categoría</label>
            <select class="form-select" id="categoria" required>
              <option>Periféricos</option><option>Componentes</option><option>Accesorios</option>
              <option>Redes</option><option>Software</option><option>Monitores</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="etiqueta" class="form-label">Etiqueta Visual</label>
            <select class="form-select mb-2" id="etiqueta">
              <option value="primary">Azul</option><option value="success">Verde</option>
              <option value="warning">Amarillo</option><option value="danger">Rojo</option>
              <option value="info">Celeste</option><option value="secondary">Gris</option>
            </select>
            <div class="progress" style="height: 1.2rem;"><div id="vista" class="progress-bar bg-primary w-100"></div></div>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label d-block">Disponibilidad</label>
          <div class="btn-group" role="group" id="grupoDisp">
            <input type="radio" class="btn-check" name="disp" id="d1" value="En Stock">
            <label class="btn btn-outline-primary" for="d1">En Stock</label>
            <input type="radio" class="btn-check" name="disp" id="d2" value="Agotado">
            <label class="btn btn-outline-primary" for="d2">Agotado</label>
          </div>
        </div>
        <button type="submit" class="btn btn-warning">Actualizar Cambios</button>
        <a href="productos.html" class="btn btn-outline-primary">Cancelar</a>
      </form>
    </div>
  </div>
  <div id="pie" class="text-center mt-4"></div>
</div>

<div class="modal fade" id="modalConfirmar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar actualización</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">¿Desea guardar los cambios realizados en este producto?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Revisar</button>
        <button type="button" class="btn btn-warning" id="btnOk">Sí, actualizar</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const SKU = new URLSearchParams(location.search).get('sku');
const form = document.getElementById('form');
const modal = new bootstrap.Modal(document.getElementById('modalConfirmar'));
function error(t) { const a = document.getElementById('alerta'); a.className = 'alert alert-danger'; a.querySelector('.msg').textContent = t; }
etiqueta.addEventListener('change', () => vista.className = `progress-bar bg-${etiqueta.value} w-100`);

App.proteger().then(async u => {
  if (!u) return;
  try {
    const p = await Api.obtener(SKU);
    bSku.textContent = 'SKU: ' + p.sku;
    nombre.value = p.nombre; sku.value = p.sku;
    categoria.value = p.categorias[0];
    etiqueta.value = p.etiqueta; etiqueta.dispatchEvent(new Event('change'));
    if (p.disponibilidad === 'Descontinuado') {
      grupoDisp.insertAdjacentHTML('beforeend', '<input type="radio" class="btn-check" name="disp" id="d3" value="Descontinuado"><label class="btn btn-outline-primary" for="d3">Descontinuado</label>');
    }
    document.querySelector(`[name=disp][value="${p.disponibilidad}"]`).checked = true;
  } catch (err) { error(err.message); form.querySelectorAll('input,select,button').forEach(e => e.disabled = true); }
});

form.addEventListener('submit', e => {
  e.preventDefault();
  form.classList.add('was-validated');
  if (form.checkValidity()) modal.show();
});
document.getElementById('btnOk').addEventListener('click', async () => {
  try {
    await Api.actualizar(SKU, { nombre: nombre.value, categorias: [categoria.value], etiqueta: etiqueta.value,
      disponibilidad: document.querySelector('[name=disp]:checked').value });
    location.href = 'productos.html?msg=' + encodeURIComponent('Producto actualizado correctamente.');
  } catch (err) { modal.hide(); error(err.message); }
});
</script>
</body>
</html>
