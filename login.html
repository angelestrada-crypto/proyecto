<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 460px;">
  <div id="alerta" class="alert alert-info alert-dismissible fade show" role="alert">
    <span class="msg">Bienvenido. Ingrese sus credenciales.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div class="card shadow">
    <div class="card-body p-4">
      <h1 class="h2 text-center mb-1">Acceso</h1>
      <div class="text-center mb-3"><span class="badge bg-primary">Control de Usuarios</span></div>
      <form id="form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo / Usuario</label>
          <div class="input-group has-validation">
            <span class="input-group-text">@</span>
            <input type="email" class="form-control" id="email" placeholder="usuario@dominio.com" required>
            <div class="invalid-feedback">Ingrese un correo válido.</div>
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required>
          <div class="invalid-feedback">Ingrese su contraseña.</div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="recordar">
          <label class="form-check-label" for="recordar">Recordar sesión en este equipo</label>
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary">Ingresar al Panel</button>
        </div>
      </form>
      <div class="text-center">
        <a href="registro.html">Registrar Nueva Cuenta</a> |
        <a href="#" data-bs-toggle="modal" data-bs-target="#modalOlvide">Olvidé mi contraseña</a><br>
        <a href="index.html" class="small">Volver al Inicio</a>
      </div>
    </div>
  </div>
  <div id="pie" class="text-center mt-3"></div>
</div>

<div class="modal fade" id="modalOlvide" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Recuperar contraseña</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <label for="emailRec" class="form-label">Correo registrado</label>
        <div class="input-group">
          <span class="input-group-text">@</span>
          <input type="email" class="form-control" id="emailRec" placeholder="usuario@dominio.com">
        </div>
        <div id="msgRec" class="alert alert-success mt-3 d-none">Si el correo existe, recibirá las instrucciones para restablecer su contraseña.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" id="btnRec">Enviar instrucciones</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
App.pie();
Api.sesion().then(u => { if (u) location.href = 'panel.html'; }).catch(() => {});
const form = document.getElementById('form');
form.addEventListener('submit', async e => {
  e.preventDefault();
  form.classList.add('was-validated');
  if (!form.checkValidity()) return;
  try {
    await Api.login(email.value, password.value, recordar.checked);
    location.href = 'panel.html';
  } catch (err) {
    App.alerta('alerta', 'danger', err.message);
  }
});
document.getElementById('btnRec').addEventListener('click', () => {
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailRec.value);
  emailRec.classList.toggle('is-invalid', !ok);
  if (ok) msgRec.classList.remove('d-none');
});
</script>
</body>
</html>
