<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuevo Producto - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 820px;">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="panel.html">Panel de Control</a></li>
      <li class="breadcrumb-item active" aria-current="page">Registro de Producto</li>
    </ol>
  </nav>
  <div id="alerta" class="alert d-none" role="alert"><span class="msg"></span></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Nuevo Producto <span class="badge bg-secondary">Inventario</span></h1>
    <a href="panel.html" class="btn btn-outline-secondary">Volver al Panel</a>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form id="form" novalidate>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre del Producto</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ej. Teclado Mecánico RGB" minlength="3" required>
            <div class="invalid-feedback">Ingrese el nombre (mínimo 3 caracteres).</div>
          </div>
          <div class="col-md-6">
            <label for="sku" class="form-label">Código SKU</label>
            <input type="text" class="form-control" id="sku" placeholder="PROD-001" pattern="[A-Za-z0-9\-]{3,20}" required>
            <div class="invalid-feedback">SKU de 3 a 20 caracteres (letras, números y guion).</div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="categorias" class="form-label">Categorías Asignadas</label>
            <select class="form-select" id="categorias" multiple size="4" required>
              <option>Periféricos</option><option>Componentes</option><option>Accesorios</option>
              <option>Redes</option><option>Software</option><option>Monitores</option>
            </select>
            <div class="form-text">Ctrl + clic para seleccionar varias.</div>
            <div class="invalid-feedback">Seleccione al menos una categoría.</div>
          </div>
          <div class="col-md-6">
            <label for="etiqueta" class="form-label">Etiqueta Visual</label>
            <select class="form-select mb-2" id="etiqueta">
              <option value="primary">Azul</option><option value="success">Verde</option>
              <option value="warning">Amarillo</option><option value="danger">Rojo</option>
              <option value="info">Celeste</option><option value="secondary">Gris</option>
            </select>
            <div class="progress" style="height: 1.2rem;"><div id="vista" class="progress-bar bg-primary w-100"></div></div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label d-block">Disponibilidad Inicial</label>
          <div class="btn-group" role="group" aria-label="Disponibilidad">
            <input type="radio" class="btn-check" name="disp" id="d1" value="En Stock" checked>
            <label class="btn btn-outline-primary" for="d1">En Stock</label>
            <input type="radio" class="btn-check" name="disp" id="d2" value="Agotado">
            <label class="btn btn-outline-primary" for="d2">Agotado</label>
            <input type="radio" class="btn-check" name="disp" id="d3" value="Descontinuado">
            <label class="btn btn-outline-primary" for="d3">Descontinuado</label>
          </div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="publicar" checked>
          <label class="form-check-label" for="publicar">Publicar inmediatamente en el catálogo general</label>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Producto</button>
        <a href="productos.html" class="btn btn-outline-danger">Cancelar</a>
      </form>
    </div>
  </div>
  <div id="pie" class="text-center mt-4"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
App.proteger();
const form = document.getElementById('form');
etiqueta.addEventListener('change', () => vista.className = `progress-bar bg-${etiqueta.value} w-100`);
const sel = () => [...categorias.selectedOptions].map(o => o.value);
categorias.addEventListener('change', () => categorias.setCustomValidity(sel().length ? '' : 'x'));
form.addEventListener('submit', async e => {
  e.preventDefault();
  categorias.setCustomValidity(sel().length ? '' : 'x');
  form.classList.add('was-validated');
  if (!form.checkValidity()) return;
  try {
    await Api.crear({ nombre: nombre.value, sku: sku.value, categorias: sel(), etiqueta: etiqueta.value,
      disponibilidad: document.querySelector('[name=disp]:checked').value, publicado: publicar.checked });
    location.href = 'productos.html?msg=' + encodeURIComponent('Producto guardado correctamente.');
  } catch (err) {
    const a = document.getElementById('alerta');
    a.className = 'alert alert-danger'; a.querySelector('.msg').textContent = err.message;
  }
});
</script>
</body>
</html>
