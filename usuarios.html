<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="panel.html">Panel de Control</a></li>
      <li class="breadcrumb-item active" aria-current="page">Usuarios</li>
    </ol>
  </nav>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Usuarios Registrados <span class="badge bg-primary" id="total">0</span></h1>
    <a href="panel.html" class="btn btn-outline-secondary">Volver al Panel</a>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead><tr><th>Nombres</th><th>Apellidos</th><th>Correo</th><th>Registro</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </div>
  <div id="pie" class="text-center mt-4"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
App.proteger().then(async u => {
  if (!u) return;
  const us = await Api.usuarios();
  total.textContent = us.length;
  filas.innerHTML = us.map(x => `<tr><td>${App.esc(x.nombres)}</td><td>${App.esc(x.apellidos)}</td>
    <td>${App.esc(x.email)}</td><td>${new Date(x.creado.includes('T') ? x.creado : x.creado.replace(' ', 'T') + 'Z').toLocaleDateString('es-PE')}</td></tr>`).join('');
});
</script>
</body>
</html>
