<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="panel.html">Panel de Control</a></li>
      <li class="breadcrumb-item active" aria-current="page">Productos</li>
    </ol>
  </nav>
  <div id="alerta" class="alert d-none" role="alert"><span class="msg"></span></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Catálogo de Productos <span class="badge bg-primary" id="total">0</span></h1>
    <div>
      <a href="producto-nuevo.html" class="btn btn-primary">Nuevo Producto</a>
      <a href="panel.html" class="btn btn-outline-secondary">Volver al Panel</a>
    </div>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead><tr><th>SKU</th><th>Producto</th><th>Categorías</th><th>Estado</th><th>Publicado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody id="filas"><tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div id="pie" class="text-center mt-4"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
App.proteger().then(async u => {
  if (!u) return;
  if (params.get('msg')) {
    const el = document.getElementById('alerta');
    el.className = 'alert alert-success alert-dismissible fade show';
    el.innerHTML = '<span class="msg"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    el.querySelector('.msg').textContent = params.get('msg');
  }
  const ps = await Api.listar();
  total.textContent = ps.length;
  filas.innerHTML = ps.length ? ps.map(p => `
    <tr>
      <td><span class="badge text-bg-${p.etiqueta}">${App.esc(p.sku)}</span></td>
      <td>${App.esc(p.nombre)}</td>
      <td>${p.categorias.map(App.esc).join(', ')}</td>
      <td>${App.badgeDisp(p.disponibilidad)}</td>
      <td>${p.publicado ? 'Sí' : 'No'}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-warning" href="producto-editar.html?sku=${encodeURIComponent(p.sku)}">Editar</a>
        <a class="btn btn-sm btn-danger" href="producto-eliminar.html?sku=${encodeURIComponent(p.sku)}">Eliminar</a>
      </td>
    </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted">No hay productos registrados.</td></tr>';
});
</script>
</body>
</html>
