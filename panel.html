<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Control - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
      <li class="breadcrumb-item active" aria-current="page">Panel de Control</li>
    </ol>
  </nav>
  <div class="alert alert-info alert-dismissible fade show" role="alert">
    Bienvenido al panel general del sistema, <strong class="nombre-usuario"></strong>.
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Panel Operativo</h1>
    <div>
      <button type="button" class="btn btn-primary">Mensajes <span class="badge text-bg-danger" id="bMensajes">0</span></button>
      <button type="button" class="btn btn-outline-secondary btn-salir">Cerrar sesión</button>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-md-3">
      <div class="list-group">
        <a href="panel.html" class="list-group-item list-group-item-action active">Inicio</a>
        <a href="productos.html" class="list-group-item list-group-item-action">Productos</a>
        <a href="usuarios.html" class="list-group-item list-group-item-action">Usuarios</a>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Stock Disponible</h5>
          <span class="badge bg-success"><span id="nStock">0</span> En Stock</span>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Avisos Pendientes</h5>
          <span class="badge bg-warning text-dark"><span id="nCriticos">0</span> Críticos</span>
        </div>
      </div>
    </div>
  </div>
  <div id="pie" class="text-center mt-4"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
App.proteger().then(async u => {
  if (!u) return;
  const r = await Api.resumen();
  nStock.textContent = r.enStock;
  nCriticos.textContent = r.criticos;
  bMensajes.textContent = r.criticos;
});
</script>
</body>
</html>
