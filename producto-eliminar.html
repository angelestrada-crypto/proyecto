<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eliminar Producto - InventarioPro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 820px;">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="panel.html">Panel de Control</a></li>
      <li class="breadcrumb-item"><a href="productos.html">Productos</a></li>
      <li class="breadcrumb-item active" aria-current="page">Eliminar Producto</li>
    </ol>
  </nav>
  <div class="alert alert-danger" role="alert">
    <h4 class="alert-heading h5">¡Atención! Confirmación requerida</h4>
    <p class="mb-0">Esta acción no se puede deshacer. Se eliminará el registro permanentemente de la base de datos.</p>
  </div>
  <div id="alerta" class="alert d-none" role="alert"><span class="msg"></span></div>
  <div class="card bg-light border-secondary mb-3">
    <div class="card-body">
      <h5 class="card-title">Detalles del Registro:</h5>
      <p class="mb-1"><strong>SKU:</strong> <span id="dSku">-</span></p>
      <p class="mb-1"><strong>Producto:</strong> <span id="dNombre">-</span></p>
      <p class="mb-1"><strong>Categoría:</strong> <span id="dCat">-</span></p>
      <p class="mb-0"><strong>Estado Actual:</strong> <span id="dEstado">-</span></p>
    </div>
  </div>
  <button type="button" class="btn btn-danger" id="btnEliminar">Confirmar y Eliminar</button>
  <a href="productos.html" class="btn btn-secondary">Cancelar y Volver</a>
  <div id="pie" class="text-center mt-4"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const SKU = new URLSearchParams(location.search).get('sku');
function error(t) { const a = document.getElementById('alerta'); a.className = 'alert alert-danger'; a.querySelector('.msg').textContent = t; }
App.proteger().then(async u => {
  if (!u) return;
  try {
    const p = await Api.obtener(SKU);
    dSku.textContent = p.sku; dNombre.textContent = p.nombre;
    dCat.textContent = p.categorias.join(', ');
    dEstado.innerHTML = App.badgeDisp(p.disponibilidad);
  } catch (err) { error(err.message); btnEliminar.disabled = true; }
});
btnEliminar.addEventListener('click', async () => {
  try {
    await Api.eliminar(SKU);
    location.href = 'productos.html?msg=' + encodeURIComponent('Producto eliminado correctamente.');
  } catch (err) { error(err.message); }
});
</script>
</body>
</html>
